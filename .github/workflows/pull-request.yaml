name: PR Check
on: [pull_request]

# When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Golang Style and Lint Check
        run: make check
        timeout-minutes: 30
      - name: verify config/schema.json is up to date
        run: |
          make generate
          git diff --exit-code

  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Run benchmarks
        run: make go-bench
        timeout-minutes: 15

  examples:
    name: Check examples
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - run: make build-linux
      - run: make image-quick
        env:
          VERSION: dev # predictable image tag below
      - name: start docker compose example
        working-directory: examples/docker
        run: |
          eval $(./init.sh) # tls
          docker compose up --quiet-pull --wait --wait-timeout 300 --detach
        env:
          OCP_IMAGE: docker.io/openpolicyagent/opa-control-plane:dev
      - name: smoke test curl
        run: |
          # Retry the full curl|jq pipeline — curl --retry only retries on
          # connection/HTTP errors, not on "200 but wrong body" which happens
          # while OPA is still waiting for the bundle from s3proxy.
          retry() { for i in $(seq 1 30); do if "$@"; then return 0; fi; echo "attempt $i failed, retrying in 5s..."; sleep 5; done; return 1; }
          retry sh -c 'curl --fail -s http://127.0.0.1:8282/v1/bundles -H "Authorization: bearer sesame" | jq -e ".result | length > 0"'
          retry sh -c 'curl --fail -s http://127.0.0.1:8181/v1/data/k8s/authz/decision/status/allowed -d "{\"input\":{\"apiVersion\":\"v1\"}}" | jq -e ".result == true"'
      - name: dump logs
        run: docker compose logs
        working-directory: examples/docker
        if: always()
